<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Day">
<title>My Workout Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<main class="app">
  <header>
    <p class="weekday" id="weekday"></p>
    <h1 class="date" id="date"></h1>
  </header>

  <section class="progress" aria-live="polite">
    <div class="progress-row">
      <span class="count" id="count"></span>
      <span class="status" id="status"></span>
    </div>
    <div class="steps" id="steps"></div>
  </section>

  <ul class="list" id="list"></ul>

  <p class="note" id="note"></p>
</main>

</body>
</html>
