<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Day">
<title>My Workout Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=5">
<script src="app.js?v=5" defer></script>
</head>
<body>

<main class="app">

  <!-- Today tab -->
  <section class="view" id="view-today">
    <header>
      <p class="weekday" id="weekday"></p>
      <h1 class="date" id="date"></h1>
    </header>

    <div class="progress" aria-live="polite">
      <div class="progress-row">
        <span class="count" id="count"></span>
        <span class="status" id="status"></span>
      </div>
      <div class="steps" id="steps"></div>
    </div>

    <ul class="list" id="list"></ul>

    <p class="note" id="note"></p>
  </section>

  <!-- Calendar tab -->
  <section class="view" id="view-calendar" hidden>
    <header class="cal-header">
      <button type="button" class="icon-btn" id="cal-prev" aria-label="Previous month">‹</button>
      <h1 class="cal-title" id="cal-title"></h1>
      <button type="button" class="icon-btn" id="cal-next" aria-label="Next month">›</button>
    </header>

    <div class="cal-weekdays" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <ul class="legend">
      <li><span class="dot good"></span>Goal reached</li>
      <li><span class="dot partial"></span>Some done</li>
      <li><span class="dot missed"></span>Missed</li>
    </ul>

    <div class="day-detail" id="day-detail" aria-live="polite"></div>
  </section>

  <!-- Stats tab -->
  <section class="view" id="view-stats" hidden>
    <h1 class="date">Stats</h1>

    <!-- Period switch: this week / this month / all time -->
    <div class="segmented" role="group" aria-label="Period">
      <button type="button" id="period-week" data-period="week">This week</button>
      <button type="button" id="period-month" data-period="month">This month</button>
      <button type="button" id="period-all" data-period="all">All time</button>
    </div>

    <!-- Headline: share of days with the goal reached -->
    <div class="hero">
      <p class="hero-label">Days with goal reached</p>
      <p class="hero-value" id="hero-value"></p>
      <p class="hero-sub" id="hero-sub"></p>
    </div>

    <!-- Per-exercise counts -->
    <div class="card">
      <h2 class="card-title">Times done</h2>
      <ul class="bars" id="ex-bars"></ul>
    </div>

    <!-- Weekly chart: green / yellow / red days in each of the last 8 weeks -->
    <div class="card">
      <h2 class="card-title">Last 8 weeks</h2>
      <p class="card-sub">Days per week · tap a week for details</p>
      <div class="weeks" id="weeks"></div>
      <ul class="legend">
        <li><span class="dot good"></span>Goal reached</li>
        <li><span class="dot partial"></span>Some done</li>
        <li><span class="dot missed"></span>Missed</li>
      </ul>
      <p class="week-detail" id="week-detail" aria-live="polite"></p>
    </div>
  </section>

</main>

<!-- Bottom tab bar -->
<nav class="tabbar" aria-label="Sections">
  <button type="button" class="tab" id="tab-today" data-view="today">Today</button>
  <button type="button" class="tab" id="tab-calendar" data-view="calendar">Calendar</button>
  <button type="button" class="tab" id="tab-stats" data-view="stats">Stats</button>
</nav>

</body>
</html>
