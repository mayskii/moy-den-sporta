<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Day">
<title>My Workout Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">

<style>
  /* Layout: one narrow, thumb-friendly column — date, progress toward the daily goal, exercise cards that toggle */
  :root {
    --bg: #F3F6F5;          /* background: light, slightly green */
    --surface: #FFFFFF;     /* cards */
    --fg: #17201D;          /* main text */
    --muted: #66736E;       /* secondary text */
    --line: #DCE3E0;        /* borders */
    --accent: #2F7A66;      /* eucalyptus green: checkmarks and progress */
    --accent-soft: #E1EFEA; /* background of a checked card */
    --on-accent: #FFFFFF;

    --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101513; --surface: #182120; --fg: #E6EDEA; --muted: #91A09A;
      --line: #26312E; --accent: #5FBF9F; --accent-soft: #1C3029; --on-accent: #0E1A16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101513; --surface: #182120; --fg: #E6EDEA; --muted: #91A09A;
    --line: #26312E; --accent: #5FBF9F; --accent-soft: #1C3029; --on-accent: #0E1A16;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  /* room for the iPhone notch and home indicator */
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 24px 40px;
  }
  .app { max-width: 440px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }

  /* Header: weekday and date */
  .weekday { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .date { margin: 2px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }

  /* Progress toward the daily goal */
  .progress { display: flex; flex-direction: column; gap: 10px; }
  .progress-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .count { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .status { font-size: 14px; color: var(--muted); }
  .status.done { color: var(--accent); font-weight: 600; }
  .steps { display: flex; gap: 6px; }
  .step { flex: 1; height: 6px; border-radius: 3px; background: var(--line); transition: background .25s; }
  .step.on { background: var(--accent); }

  /* Exercise list */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    min-height: 60px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--fg);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .2s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; }

  .check {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line);
    display: grid; place-items: center;
    transition: background .2s, border-color .2s;
  }
  .check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .15s; }
  .check path { fill: none; stroke: var(--on-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .item[aria-pressed="true"] .check { background: var(--accent); border-color: var(--accent); }
  .item[aria-pressed="true"] .check svg { opacity: 1; }

  .name { flex: 1; min-width: 0; font-weight: 500; }
  .dose { flex: none; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .note { margin: 0; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="app">
  <header>
    <p class="weekday" id="weekday"></p>
    <h1 class="date" id="date"></h1>
  </header>

  <section class="progress" aria-live="polite">
    <div class="progress-row">
      <span class="count" id="count"></span>
      <span class="status" id="status"></span>
    </div>
    <div class="steps" id="steps"></div>
  </section>

  <ul class="list" id="list"></ul>

  <p class="note" id="note"></p>
</main>

<script>
  // ---------- 1. Default data ----------
  // The exercise library. Each exercise has an id (internal name, never changes),
  // a display name and a "dose" — how much to do.
  const DEFAULT_EXERCISES = [
    { id: "walk",    name: "Walk",         dose: "30 min" },
    { id: "squats",  name: "Squats",       dose: "×10" },
    { id: "pushups", name: "Push-ups",     dose: "×10" },
    { id: "plank",   name: "Plank",        dose: "1 min" },
    { id: "qigong",  name: "Qigong",       dose: "30 min" },
    { id: "face",    name: "Face yoga",    dose: "30 min" },
    { id: "stretch", name: "Stretching",   dose: "5 min" },
  ];
  const DEFAULT_GOAL = 3; // daily goal: how many exercises to do

  // ---------- 2. Storage ----------
  // The whole app is stored as one object in the browser's memory (localStorage):
  // {
  //   goal: 3,                                    — daily goal
  //   days: { "2026-10-16": ["walk", "plank"] }   — what was checked on which day
  // }
  // Days are stored by exercise id, so renaming an exercise keeps its history.
  // Until there is a screen for editing the library, the list always comes from DEFAULT_EXERCISES.
  const STORAGE_KEY = "moy-den-sporta";
  let storageWorks = true;

  function load() {
    const state = { exercises: DEFAULT_EXERCISES, goal: DEFAULT_GOAL, days: {} };
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.days) { state.days = saved.days; state.goal = saved.goal || DEFAULT_GOAL; }
    } catch (e) { storageWorks = false; }
    return state;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ goal: state.goal, days: state.days }));
      storageWorks = true;
    } catch (e) { storageWorks = false; }
  }

  let state = load();

  // ---------- 3. Today ----------
  // A day's key is the date as YYYY-MM-DD in the phone's local time.
  function dayKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  // ---------- 4. Checking an exercise ----------
  // Tapping a card adds the exercise to today's done list,
  // or removes it if it was already checked.
  function toggle(id) {
    const key = dayKey(new Date());
    const done = new Set(state.days[key] || []);
    done.has(id) ? done.delete(id) : done.add(id);
    state.days[key] = [...done];
    save();
    render();
  }

  // ---------- 5. Drawing the screen ----------
  const CHECK_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function render() {
    const now = new Date();
    const done = new Set(state.days[dayKey(now)] || []);
    const count = state.exercises.filter(ex => done.has(ex.id)).length;
    const goal = state.goal;

    // Date
    document.getElementById("weekday").textContent = now.toLocaleDateString("en-US", { weekday: "long" });
    document.getElementById("date").textContent = now.toLocaleDateString("en-US", { month: "long", day: "numeric" });

    // Progress: "2 of 3" and a bar with one segment per goal step
    document.getElementById("count").textContent = `${Math.min(count, goal)} of ${goal}` + (count > goal ? ` · ${count} total` : "");
    const status = document.getElementById("status");
    if (count >= goal) { status.textContent = "Goal reached"; status.className = "status done"; }
    else if (count > 0) { status.textContent = `${goal - count} to go`; status.className = "status"; }
    else { status.textContent = "Nothing yet"; status.className = "status"; }

    document.getElementById("steps").innerHTML =
      Array.from({ length: goal }, (_, i) => `<span class="step${i < count ? " on" : ""}"></span>`).join("");

    // Exercise list
    const list = document.getElementById("list");
    list.innerHTML = "";
    for (const ex of state.exercises) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.id = "ex-" + ex.id;
      btn.className = "item";
      btn.setAttribute("aria-pressed", done.has(ex.id));
      btn.innerHTML = `<span class="check">${CHECK_ICON}</span><span class="name"></span><span class="dose"></span>`;
      btn.querySelector(".name").textContent = ex.name;
      btn.querySelector(".dose").textContent = ex.dose;
      btn.addEventListener("click", () => toggle(ex.id));
      li.appendChild(btn);
      list.appendChild(li);
    }

    // Warning if the browser won't let us save
    document.getElementById("note").textContent = storageWorks
      ? "Your checkmarks are saved on this phone."
      : "This browser won't save data: checkmarks will be lost when you close the page.";
  }

  render();
</script>

</body>
</html>
